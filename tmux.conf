set-environment -g PATH "/usr/local/bin:/bin:/usr/bin"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# 256 terminal colors
set -g default-terminal "screen-256color"

# no delay for esc key
set -s escape-time 50

# more scrollback
set-option -g history-limit 3000

# When a session is destroyed, switch to another session instead of detaching
set-option -g detach-on-destroy off

# split panes using | and -
# (and open new panes & windows in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %


# Smart pane switching with awareness of Vim splits & FZF
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

# Local: bind -n (no prefix) so C-h/j/k/l works seamlessly
# SSH:   prefix + h/j/k/l since outer tmux intercepts C-h/j/k/l
if-shell 'test -n "$SSH_CONNECTION"' \
  'bind h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"' \
  'bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"'

if-shell 'test -n "$SSH_CONNECTION"' \
  'bind j run "($is_vim && tmux send-keys C-j) || ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"' \
  'bind -n C-j run "($is_vim && tmux send-keys C-j) || ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"'

if-shell 'test -n "$SSH_CONNECTION"' \
  'bind k run "($is_vim && tmux send-keys C-k) || ($is_fzf && tmux send-keys C-k) || tmux select-pane -U"' \
  'bind -n C-k run "($is_vim && tmux send-keys C-k) || ($is_fzf && tmux send-keys C-k) || tmux select-pane -U"'

if-shell 'test -n "$SSH_CONNECTION"' \
  'bind l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"' \
  'bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"'

if-shell 'test -n "$SSH_CONNECTION"' \
  'bind \\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"' \
  'bind -n "C-\\" if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"'

# prefix + C-l to clear console (b/c C-l is remapped above locally)
if-shell 'test -z "$SSH_CONNECTION"' \
  'bind C-l send-keys "C-l"'


# --- Prefix & Theme ---

# Prefix
if-shell 'test -n "$SSH_CONNECTION"' \
  'set -g prefix C-s; unbind C-a; bind C-s send-prefix' \
  'set -g prefix C-a; unbind C-b; bind C-a send-prefix'

# Source Fluidlan theme (always dark)
source-file ~/projects/fluidlan-theme/terminals/tmux/fluidlan.conf

# Enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


## Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux resurrect
set -g @resurrect-strategy-nvim 'session'

# tmux continuum - auto-save every 15 min, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

## test
