set-environment -g PATH "/usr/local/bin:/bin:/usr/bin"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# remap C-b to C-a
set -g prefix C-a

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# 256 terminal colors
set -g default-terminal "screen-256color"

# no delay for esc key
set -s escape-time 50

# more scrollback
set-option -g history-limit 3000

# When a session is destroyed, switch to another session instead of detaching
set-option -g detach-on-destroy off

# split panes using | and -
# (and open new panes & windows in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %


# Smart pane switching with awareness of Vim splits & FZF
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                          tmux select-pane -L"

bind -n C-j run "($is_vim & tmux send-keys C-j)  || \
                         ($is_fzf && tmux send-keys C-j) || \
                         tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                          ($is_fzf && tmux send-keys C-k)  || \
                          tmux select-pane -U"

bind -n C-l run  "($is_vim && tmux send-keys C-l) || \
                          tmux select-pane -R"

bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

# prefix + C-l to clear console (b/c C-l is remapped above)
bind C-l send-keys 'C-l'


# status bar colors
set-option -g status-interval 1
set -g status-style bg='#44475a',fg='#bd93f9'
set -g status-left '#[fg=#90d0f2]Sessions: #(~/.tmux/scripts/sessions.sh)#[fg=#6272a4]│ #[fg=#90d0f2]Windows: '
set -g status-left-length 60
set -g message-style bg='#44475a',fg='#8be9fd'

# Window list styling
set -g window-status-current-style fg='#bd93f9',bold
set -g window-status-current-format ' #I:#W '
set -g window-status-style fg='#bfbfbf'
set -g window-status-format ' #I:#W '

# Enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


## Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar w/ time, date, week number, and session list
set -g status-right '%H:%M:%S #[fg=green]%a %Y-%m-%d W%V'
set -g status-right-length 120

# tmux resurrect
set -g @resurrect-strategy-nvim 'session'

# tmux continuum - auto-save every 15 min, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
